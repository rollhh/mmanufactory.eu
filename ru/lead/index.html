<!DOCTYPE html>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Заявка на изготовление мебели | Manufactory</title>
<link rel="canonical" href="https://mmanufactory.eu/ru/lead/">
<meta name="robots" content="noindex,follow">
<link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
<style>
  #cookieConsent {
    display: none;
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    z-index: 100;
    background: #000;
    color: #fff;
    border-top: 1px solid #333;
    padding: 1rem;
  }
  #cookieConsent .cookie-content {
    max-width: 1200px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
  }
  #cookieConsent .cookie-buttons { display: flex; gap: 0.75rem; }
  #cookieConsent .cookie-buttons button {
    border-radius: 0.5rem;
    padding: 0.5rem 1.25rem;
    font-weight: 600;
  }
  #cookieConsent .btn-cookie-accept { background: white; color: black; }
  #cookieConsent .btn-cookie-decline { border: 1px solid white; color: white; }
  @media (min-width: 640px) {
    #cookieConsent .cookie-content { flex-direction: row; }
  }

    /* One compact, keyboard-accessible language selector for all languages. */
    .site-header { padding-left: 12px; padding-right: 12px; }
    .site-header .social-links { gap: 4px; }
    .language-picker { position: relative; flex: 0 0 auto; font-family: inherit; }
    .language-picker > summary {
      display: inline-flex; align-items: center; justify-content: center; gap: 3px;
      min-height: 40px; padding: 0 6px; list-style: none; cursor: pointer;
      border: 1px solid rgba(255,255,255,.45); border-radius: 8px;
      color: white; font-weight: 600; font-size: 13px;
      -webkit-tap-highlight-color: transparent;
    }
    .language-picker > summary::-webkit-details-marker { display: none; }
    .language-picker .language-options {
      position: absolute; top: calc(100% + 8px); right: 0;
      min-width: 78px; padding: 4px; border-radius: 10px;
      border: 1px solid #ddd; background: #fff; color: #111;

    .language-picker .language-options a {
      display: block; text-align: center; padding: 9px 12px;
      border-radius: 6px; font-weight: 600; font-size: 14px; color: #111;
    }
    .language-picker .language-options a:hover,
    .language-picker .language-options a[aria-current="page"] { background: #eeeae4; }
    .language-picker > summary:focus-visible,
    .language-picker .language-options a:focus-visible { outline: 2px solid #888; outline-offset: 2px; }
    .site-header .social-icon { width: 40px; height: 40px; }
    @media (max-width: 374px) {
      .site-header { padding-left: 8px; padding-right: 8px; }
      .site-header .social-icon { width: 32px; height: 32px; }
      .site-header .header-logo { height: 64px; }
      .language-picker > summary { font-size: 12px; padding: 0 4px; min-height: 36px; }
    }
    @media (min-width: 640px) {

      .site-header .social-links { gap: 8px; }
    }

    .lead-lang-bar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 14px; }
    .lead-lang-bar a.back-home { text-decoration: underline; font-size: 14px; }
    .lead-lang-bar .language-picker > summary { border: 1px solid #aaa; color: #111; min-width: 45px; }
    .lead-lang-bar .language-options { background: white; }
    .lead-lang-bar .language-picker .language-options a { text-decoration: none; }
</style>

<body class="bg-white text-black flex items-center justify-center min-h-screen">

<form id="leadForm" class="w-full max-w-lg p-6 border rounded-xl shadow-lg space-y-4" data-form-language="ru">
<div class="lead-lang-bar">
  <a class="back-home" href="/ru/">← На главную</a>
  <details class="language-picker">
        <summary aria-label="Выбрать язык">RU <span aria-hidden="true">⌄</span></summary>
        <div class="language-options">
          <a href="/lead.html" data-switch-language="lv">LV</a>
          <a href="/en/lead/" data-switch-language="en">EN</a>
          <a href="/ru/lead/" data-switch-language="ru" aria-current="page">RU</a>
        </div>
      </details>
</div>

<h1 class="text-2xl font-bold text-center">Заявка на изготовление мебели</h1>

<textarea name="request" placeholder="Какая мебель вас интересует? При необходимости добавьте фотографии ниже." aria-label="Какая мебель вас интересует? При необходимости добавьте фотографии ниже." class="w-full p-3 border rounded" required></textarea>

<div class="w-full">
  <input type="file" id="fileInput" accept="image/*" multiple class="hidden" />
  <label for="fileInput" class="block w-full p-3 border border-dashed border-gray-400 rounded text-center cursor-pointer text-gray-600 hover:bg-gray-50">
    + Добавить фотографии
  </label>
  <div id="preview" class="grid grid-cols-3 gap-2 mt-2"></div>
  <p id="fileCount" class="text-xs text-gray-500 mt-1"></p>
</div>

<textarea name="contact" placeholder="Ваше имя и номер телефона. В каком городе находится объект?" aria-label="Ваше имя и номер телефона. В каком городе находится объект?" class="w-full p-3 border rounded" required></textarea>

<button type="submit" id="submitBtn" class="w-full bg-black text-white py-3 rounded font-semibold">
Отправить заявку
</button>

<p class="text-xs text-center text-gray-600">
  <button type="button" onclick="openCookieSettings()" class="underline">Настройки cookie</button>
  &nbsp;·&nbsp; <a href="/ru/#sikdatnu" class="underline">Политика cookie и конфиденциальности</a>
</p>
</form>
<div id="cookieConsent" role="region" aria-label="Sīkdatņu izvēle">
  <div class="cookie-content">
    <p>Мы используем cookie Google и Meta для аналитики и рекламы только с вашего согласия. Вы всегда можете изменить свой выбор.</p>
    <div class="cookie-buttons">
      <button type="button" class="btn-cookie-accept" onclick="acceptCookies()">Принять</button>
      <button type="button" class="btn-cookie-decline" onclick="declineCookies()">Отклонить</button>
    </div>
  </div>
</div>

<script>
let selectedFiles = [];

function gtag_report_conversion() {
  if (!window.ManufactoryConsent || !window.ManufactoryConsent.hasConsent()) return;
  gtag('event', 'conversion', {
    'send_to': 'AW-18008605575/OB0lCJjHy5ccEIeHlotD',
    'value': 1.0,
    'currency': 'EUR'
  });
}

function compressImage(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        const max = 1600;
        let w = img.width, h = img.height;
        if (w > max || h > max) {
          if (w > h) { h = Math.round(h * max / w); w = max; }
          else { w = Math.round(w * max / h); h = max; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = w;
        canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', 0.8));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function renderPreview() {
  const box = document.getElementById('preview');
  const info = document.getElementById('fileCount');
  box.innerHTML = '';

  selectedFiles.forEach((file, i) => {
    const wrap = document.createElement('div');
    wrap.className = 'relative';

    const img = document.createElement('img');
    img.src = URL.createObjectURL(file);
    img.className = 'w-full h-24 object-cover rounded border';

    const btn = document.createElement('button');
    btn.type = 'button';
    btn.innerText = '×';
    btn.className = 'absolute top-1 right-1 bg-black text-white rounded-full w-6 h-6 leading-none text-lg';
    btn.onclick = () => {
      selectedFiles.splice(i, 1);
      renderPreview();
    };

    wrap.appendChild(img);
    wrap.appendChild(btn);
    box.appendChild(wrap);
  });

  info.innerText = selectedFiles.length
    ? 'Добавлено фотографий: ' + selectedFiles.length + ' / 10'
    : '';
}

document.getElementById('fileInput').addEventListener('change', function(){
  for (const f of Array.from(this.files)) {
    if (selectedFiles.length >= 10) {
      alert("Не более 10 фотографий");
      break;
    }
    selectedFiles.push(f);
  }
  this.value = '';
  renderPreview();
});

document.getElementById('leadForm').addEventListener('submit', async function(e){
  e.preventDefault();

  const btn = document.getElementById('submitBtn');
  btn.innerText = "Отправка...";
  btn.disabled = true;

  const request = this.request.value;
  const contact = this.contact.value;

  try {
    const photos = [];
    for (const f of selectedFiles) {
      photos.push(await compressImage(f));
    }

    const response = await fetch("/api/lead", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ request, contact, photos, language: 'ru' })
    });

    const data = await response.json();

    if (!data.ok) {
      throw new Error("send failed");
    }

    if (window.ManufactoryConsent && window.ManufactoryConsent.hasConsent()) {
      gtag_report_conversion();
      if (typeof fbq === 'function') {
        fbq('track', 'Lead');
      }
    }

    alert("Спасибо! ✅ Мы скоро с вами свяжемся.");
    this.reset();
    selectedFiles = [];
    renderPreview();
    setTimeout(() => {
      window.location.href = "/ru/";
    }, 2000);

  } catch (err) {
    console.error(err);
    alert("Ошибка отправки ❌");
  }

  btn.innerText = "Отправить заявку";
  btn.disabled = false;
});
</script>
