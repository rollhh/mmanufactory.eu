<!DOCTYPE html>
<html lang="lv">
<head>
<script src="/consent.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pieteikums konsultācijai</title>
<link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
<style>
  #cookieConsent {
    display: none;
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    z-index: 100;
    background: #000;
    color: #fff;
    border-top: 1px solid #333;
    padding: 1rem;
  }
  #cookieConsent .cookie-content {
    max-width: 1200px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
  }
  #cookieConsent .cookie-buttons { display: flex; gap: 0.75rem; }
  #cookieConsent .cookie-buttons button {
    border-radius: 0.5rem;
    padding: 0.5rem 1.25rem;
    font-weight: 600;
  }
  #cookieConsent .btn-cookie-accept { background: white; color: black; }
  #cookieConsent .btn-cookie-decline { border: 1px solid white; color: white; }
  @media (min-width: 640px) {
    #cookieConsent .cookie-content { flex-direction: row; }
  }
</style>
</head>

<body class="bg-white text-black flex items-center justify-center min-h-screen">

<form id="leadForm" class="w-full max-w-lg p-6 border rounded-xl shadow-lg space-y-4">

<h1 class="text-2xl font-bold text-center">Pieteikums konsultācijai</h1>

<textarea name="request" placeholder="Kādas mēbeles Jūs interesē? Ja nepieciešams, zemāk pievienojiet attēlu." class="w-full p-3 border rounded" required></textarea>

<div class="w-full">
  <input type="file" id="fileInput" accept="image/*" multiple class="hidden" />
  <label for="fileInput" class="block w-full p-3 border border-dashed border-gray-400 rounded text-center cursor-pointer text-gray-600 hover:bg-gray-50">
    + Pievienot attēlus
  </label>
  <div id="preview" class="grid grid-cols-3 gap-2 mt-2"></div>
  <p id="fileCount" class="text-xs text-gray-500 mt-1"></p>
</div>

<textarea name="contact" placeholder="Jūsu vārds un telefona nr. saziņai. Kurā pilsētā atrodas objekts?" class="w-full p-3 border rounded" required></textarea>

<button type="submit" id="submitBtn" class="w-full bg-black text-white py-3 rounded font-semibold">
Nosūtīt
</button>

<p class="text-xs text-center text-gray-600">
  <button type="button" onclick="openCookieSettings()" class="underline">Sīkdatņu iestatījumi</button>
  &nbsp;·&nbsp; <a href="/#sikdatnu" class="underline">Sīkdatņu un privātuma politika</a>
</p>
</form>
<div id="cookieConsent" role="region" aria-label="Sīkdatņu izvēle">
  <div class="cookie-content">
    <p>Analītikas un reklāmas sīkdatnes (Google un Meta) izmantojam tikai ar jūsu piekrišanu. Izvēli var mainīt jebkurā laikā.</p>
    <div class="cookie-buttons">
      <button type="button" class="btn-cookie-accept" onclick="acceptCookies()">Piekrist</button>
      <button type="button" class="btn-cookie-decline" onclick="declineCookies()">Noraidīt</button>
    </div>
  </div>
</div>

<script>
let selectedFiles = [];

function gtag_report_conversion() {
  if (!window.ManufactoryConsent || !window.ManufactoryConsent.hasConsent()) return;
  gtag('event', 'conversion', {
    'send_to': 'AW-18008605575/OB0lCJjHy5ccEIeHlotD',
    'value': 1.0,
    'currency': 'EUR'
  });
}

function compressImage(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        const max = 1600;
        let w = img.width, h = img.height;
        if (w > max || h > max) {
          if (w > h) { h = Math.round(h * max / w); w = max; }
          else { w = Math.round(w * max / h); h = max; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = w;
        canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', 0.8));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function renderPreview() {
  const box = document.getElementById('preview');
  const info = document.getElementById('fileCount');
  box.innerHTML = '';

  selectedFiles.forEach((file, i) => {
    const wrap = document.createElement('div');
    wrap.className = 'relative';

    const img = document.createElement('img');
    img.src = URL.createObjectURL(file);
    img.className = 'w-full h-24 object-cover rounded border';

    const btn = document.createElement('button');
    btn.type = 'button';
    btn.innerText = '×';
    btn.className = 'absolute top-1 right-1 bg-black text-white rounded-full w-6 h-6 leading-none text-lg';
    btn.onclick = () => {
      selectedFiles.splice(i, 1);
      renderPreview();
    };

    wrap.appendChild(img);
    wrap.appendChild(btn);
    box.appendChild(wrap);
  });

  info.innerText = selectedFiles.length
    ? 'Pievienoti attēli: ' + selectedFiles.length + ' / 10'
    : '';
}

document.getElementById('fileInput').addEventListener('change', function(){
  for (const f of Array.from(this.files)) {
    if (selectedFiles.length >= 10) {
      alert("Maksimums 10 attēli");
      break;
    }
    selectedFiles.push(f);
  }
  this.value = '';
  renderPreview();
});

document.getElementById('leadForm').addEventListener('submit', async function(e){
  e.preventDefault();

  const btn = document.getElementById('submitBtn');
  btn.innerText = "Nosūtīšana...";
  btn.disabled = true;

  const request = this.request.value;
  const contact = this.contact.value;

  try {
    const photos = [];
    for (const f of selectedFiles) {
      photos.push(await compressImage(f));
    }

    const response = await fetch("/api/lead", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ request, contact, photos })
    });

    const data = await response.json();

    if (!data.ok) {
      throw new Error("send failed");
    }

    if (window.ManufactoryConsent && window.ManufactoryConsent.hasConsent()) {
      gtag_report_conversion();
      if (typeof fbq === 'function') {
        fbq('track', 'Lead');
      }
    }

    alert("Paldies! ✅ Mēs sazināsimies tuvākajā laikā!");
    this.reset();
    selectedFiles = [];
    renderPreview();
    setTimeout(() => {
      window.location.href = "https://mmanufactory.eu/";
    }, 2000);

  } catch (err) {
    console.error(err);
    alert("Kļūda ❌");
  }

  btn.innerText = "Nosūtīt";
  btn.disabled = false;
});
</script>
